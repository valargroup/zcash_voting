[package]
name = "vote-commitment-tree"
version = "0.6.3"
edition = "2021"
rust-version = "1.91"
description = "Append-only Poseidon Merkle tree for Vote Authority Notes and Vote Commitments in the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[features]
default = ["zakura"]
zakura = [
    "imt-tree/zakura",
    "voting-crypto-deps/default",
    "voting-circuits/default",
    "dep:shardtree",
]
lrz = [
    "imt-tree/upstream",
    "voting-crypto-deps/lrz",
    "voting-circuits/lrz",
    "dep:lrz-shardtree",
]

[dependencies]
imt-tree = { version = "=0.5.4", default-features = false }
voting-crypto-deps = { workspace = true }
anyhow = "1.0"
# `shardtree` must match the backend-selected
# `voting_crypto_deps::incrementalmerkletree`, so each backend selects its own.
shardtree = { version = "0.7", optional = true }
lrz-shardtree = { package = "shardtree", version = "0.8", optional = true }
lazy_static = "1"
libc = "0.2"

[dev-dependencies]
rand = "0.8"
voting-circuits = { workspace = true }
