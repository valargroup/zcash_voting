[package]
name = "vote-commitment-tree"
version = "0.6.3"
edition = "2021"
rust-version = "1.97"
description = "Append-only Poseidon Merkle tree for Vote Authority Notes and Vote Commitments in the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[features]
default = ["zakura"]
zakura = ["imt-tree/zakura", "voting-crypto-deps/default", "voting-circuits/default"]
lrz = ["imt-tree/upstream", "voting-crypto-deps/lrz", "voting-circuits/lrz"]

[dependencies]
imt-tree = { git = "https://github.com/valargroup/vote-nullifier-pir", rev = "1b862cf61f30caf71d21cfb72e0418db9721c215", version = "=0.5.4", default-features = false }
voting-crypto-deps = { workspace = true }
anyhow = "1.0"
incrementalmerkletree = "0.8.1"
shardtree = "0.7"
lazy_static = "1"
libc = "0.2"

[dev-dependencies]
rand = "0.8"
voting-circuits = { workspace = true }
