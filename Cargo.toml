voting-circuits = { git = "https://github.com/zodl-inc/voting-circuits", rev = "1e33d48e436482e0f364ff0f9f886904f88fa515" }
voting-crypto-deps = { git = "https://github.com/zodl-inc/voting-circuits", rev = "1e33d48e436482e0f364ff0f9f886904f88fa515" }
imt-tree = { git = "https://github.com/zodl-inc/voting-circuits", rev = "1e33d48e436482e0f364ff0f9f886904f88fa515" }
pir-types = { git = "https://github.com/zodl-inc/vote-nullifier-pir", rev = "9c62d0565f6cc963e7875f9f40822764431eeab9" }
pir-client = { git = "https://github.com/zodl-inc/vote-nullifier-pir", rev = "9c62d0565f6cc963e7875f9f40822764431eeab9" }

[profile.test.package.imt-tree]
opt-level = 3

[profile.test.package.valar-ypir]
opt-level = 3

[profile.test.package.valar-spiral-rs]
opt-level = 3

# Debug info dominates link time across the ~900-test suite and is the main
# reason `target/` grows without bound. Line tables preserve backtraces and
# panic locations; full DWARF for third-party crates buys nothing locally.
# CI achieves the same for one job via CARGO_PROFILE_TEST_DEBUG=0.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
