[workspace]
members = [
    "recovery-conformance",
    "stage-bench",
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
# The default root build is the Zakura application path. LRZ and the
# lower-level VCT packages are validated in separate invocations because their
# backend features are mutually exclusive within one Cargo resolve.
default-members = [
    "zcash_voting",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
voting-circuits = { git = "https://github.com/valargroup/voting-circuits.git", rev = "262e12ce86727016c7b125b284becf1c2695a364", version = "=0.14.0", default-features = false }
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits.git", rev = "262e12ce86727016c7b125b284becf1c2695a364", version = "=0.4.0", default-features = false }
# Zakura 4.0 publishes protocol as `zakura-protocol` with lib name `zcash_protocol`.
# Packages select one of these through the `zakura` / `lrz` features.
zcash_protocol = { version = "=5.0.0", git = "https://github.com/zakura-core/common.git", rev = "26fb46d9110092f07cc682f16d4678b01fb915df", package = "zakura-protocol", default-features = false }
lrz_zcash_protocol = { version = "0.11", package = "zcash_protocol" }

[profile.test.package.imt-tree]
opt-level = 3

[profile.test.package.valar-ypir]
opt-level = 3

[profile.test.package.valar-spiral-rs]
opt-level = 3

# Debug info dominates link time across the ~900-test suite and is the main
# reason `target/` grows without bound. Line tables preserve backtraces and
# panic locations; full DWARF for third-party crates buys nothing locally.
# CI achieves the same for one job via CARGO_PROFILE_TEST_DEBUG=0.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[patch.crates-io]
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits.git", rev = "262e12ce86727016c7b125b284becf1c2695a364" }
voting-circuits = { git = "https://github.com/valargroup/voting-circuits.git", rev = "262e12ce86727016c7b125b284becf1c2695a364" }
